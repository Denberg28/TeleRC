name: TeleRC Go 1.0.2 Wi-Fi stable release
on:
 push:
  branches: ['release/telerc-go-wifi-102']
concurrency:
 group: telerc-go-wifi-102
 cancel-in-progress: true
permissions:
 contents: write
 actions: read
jobs:
 qualify:
  runs-on: ubuntu-latest
  timeout-minutes: 50
  steps:
   - uses: actions/checkout@v4
     with: {fetch-depth: 0}
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v4
   - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
   - name: Source and firmware host regression
     run: |
      python3 scripts/sync-go-core.py --check
      python3 bridge/sync_motor_core.py --check
      bridge/tests/run.sh
      SANITIZE=1 bridge/tests/run.sh
      bridge/mini_wifi_tests/run.sh
      SANITIZE=1 bridge/mini_wifi_tests/run.sh
      bridge/mini_wifi_tests/check_profiles.sh
      firmware/go/tests/run.sh
      SANITIZE=1 firmware/go/tests/run.sh
   - name: Retain signing identity
     env:
      KEYSTORE_BASE64: ${{ secrets.TELERC_KEYSTORE_BASE64 }}
     run: |
      test -n "$KEYSTORE_BASE64"
      printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telerc-release.jks"
      echo "TELERC_KEYSTORE_FILE=$RUNNER_TEMP/telerc-release.jks" >> "$GITHUB_ENV"
   - name: Both apps regression and Go signed APK
     env:
      TELERC_KEYSTORE_PASSWORD: ${{ secrets.TELERC_KEYSTORE_PASSWORD }}
      TELERC_KEY_ALIAS: ${{ secrets.TELERC_KEY_ALIAS }}
      TELERC_KEY_PASSWORD: ${{ secrets.TELERC_KEY_PASSWORD }}
     run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :go:testDebugUnitTest :go:lintDebug :go:lintRelease :go:assembleDebug :go:assembleDebugAndroidTest :go:assembleRelease --no-daemon
   - name: Go Kotlin to actual four-wheel parser integration
     run: |
      g++ -std=c++17 -Wall -Wextra -Werror -DTELERC_HOST_TEST=1 -DTELERC_GO_ELRS=0 -Ibridge/mini_wifi_tests/stubs firmware/go/tests/test_wifi.cpp -o /tmp/go-wire-integration
      /tmp/go-wire-integration go/build/go-interop
   - uses: arduino/setup-arduino-cli@v2
   - name: Actual four-wheel ESP32-S3 builds
     run: |
      arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      mkdir -p deliverables/firmware
      for driver in MX1508 BTS7960; do
       for elrs in 0 1; do
        flags="-DTELERC_GO_ELRS=$elrs"
        if [ "$driver" = BTS7960 ]; then flags="$flags -DTELERC_DRIVER=4 -DTELERC_SUPPLY_MAX_MV=12000 -DTELERC_MOTOR_RATED_MV=12000 -DTELERC_BTS_LOGIC_VERIFIED=1"; fi
        arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --build-property "compiler.cpp.extra_flags=$flags" --output-dir "deliverables/firmware/$driver-ELRS$elrs" firmware/go/TeleRC_Go_Rover
       done
      done
   - name: Reclaim before emulator
     run: python3 scripts/reclaim-ui-runner.py
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - name: Go native UI and live UDP fault recovery
     uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 35
      target: default
      arch: x86_64
      profile: pixel_2
      ram-size: 3072M
      cores: 2
      disable-animations: true
      emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
      script: bash scripts/check-go-ui.sh
   - name: Package verified stable distribution
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      cp go/build/outputs/apk/release/go-release.apk deliverables/TeleRC-Go-v1.0.2.apk
      gh release download v0.8.89 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.89.apk --output "$RUNNER_TEMP/baseline.apk"
      python3 scripts/verify-go-release.py deliverables/TeleRC-Go-v1.0.2.apk "$RUNNER_TEMP/baseline.apk" > deliverables/BUILD_INFO.txt
      git archive --format=zip -o deliverables/TeleRC-Go-v1.0.2-source.zip HEAD
      cp docs/TELERC_GO.md deliverables/START_HERE.md
      cp -R firmware/go/TeleRC_Go_Rover deliverables/
      cp docs/GO_WIRING.md deliverables/
      (cd deliverables && zip -qr TeleRC-Go-v1.0.2-four-wheel-firmware.zip firmware TeleRC_Go_Rover GO_WIRING.md START_HERE.md BUILD_INFO.txt)
      zip -qr deliverables/TeleRC-Go-v1.0.2-test-evidence.zip go/build/reports/ go/build/test-results/ go/build/ui-evidence/
      cd deliverables
      sha256sum *.apk *.zip *.md BUILD_INFO.txt > SHA256SUMS.txt
      sha256sum -c SHA256SUMS.txt
      python3 -c 'import glob,zipfile; assert all(zipfile.ZipFile(p).testzip() is None for p in glob.glob("*.zip"))'
   - name: Publish owner-requested stable Go release
     env:
      GH_TOKEN: ${{ github.token }}
     run: |
      test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
      gh release create go-v1.0.2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --latest=false --title 'TeleRC Go v1.0.2 — stable Wi-Fi, ARM/DISARM and Switch A takeover' --notes-file deliverables/START_HERE.md deliverables/*.apk deliverables/*.zip deliverables/*.md deliverables/BUILD_INFO.txt deliverables/SHA256SUMS.txt
      gh release edit go-v1.0.2 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: TeleRC-Go-1.0.2
      path: |
       deliverables/
       go/build/outputs/apk/
       go/build/reports/
       go/build/test-results/
       go/build/ui-evidence/
      retention-days: 7
   - if: always()
     run: rm -f "$RUNNER_TEMP/telerc-release.jks"
