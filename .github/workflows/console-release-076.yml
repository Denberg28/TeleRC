name: TeleRC 0.8.76 release packaging
on:
  push:
    branches: ['release/expanded-console-076-*']
permissions:
  contents: write
  actions: read
concurrency:
  group: console-release-076
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Confirm unchanged qualified sources and recover validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code cfa044896a2f8ca40dffb78366d635a38b3722b5 HEAD -- app bridge scripts tests build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat
          mkdir -p app/build/photo-evidence deliverables validation-evidence
          gh api repos/$GITHUB_REPOSITORY/actions/runs/39083855942 > validation-evidence/run.json
          gh api repos/$GITHUB_REPOSITORY/actions/runs/39083855942/jobs > validation-evidence/jobs.json
          gh api --allow-escape-sequences repos/$GITHUB_REPOSITORY/actions/jobs/117546228725/logs > validation-evidence/qualification.log
          python - <<'PY'
          import base64, json, pathlib, re
          out=pathlib.Path('validation-evidence')
          run=json.loads((out/'run.json').read_text())
          assert run['head_sha']=='cfa044896a2f8ca40dffb78366d635a38b3722b5'
          assert run['status']=='completed'
          jobs=json.loads((out/'jobs.json').read_text())['jobs']
          job=next(j for j in jobs if j['id']==117546228725)
          required=['Existing control and firmware host regression','JVM tests, debug and release lint/build','Native maze, photo background and FPV menu checks','Verify compiled USB registration and retained signing identity','Package check evidence']
          for name in required:
              assert next(s for s in job['steps'] if s['name']==name)['conclusion']=='success', name
          assert all(s['name']=='Run actions/upload-artifact@v4' for s in job['steps'] if s['conclusion']=='failure')
          logs=(out/'qualification.log').read_text(encoding='utf-8-sig')
          assert 'Artifact storage quota has been hit' in logs
          result=re.search(r'INSTRUMENTATION_RESULT: stream=(PASS:[^\n]+)', logs).group(1)
          assert 'expanded console geometry' in result
          assert 'INSTRUMENTATION_CODE: -1' in logs
          pathlib.Path('app/build/photo-evidence/result.txt').write_text(result+'\n')
          (out/'native-result.txt').write_text(result+'\n')
          for name,data in re.findall(r'([A-Z_]+)_UI_PNG=([A-Za-z0-9+/=]+)',logs):
              (out/(name.lower()+'.png')).write_bytes(base64.b64decode(data))
          print('PASS: exact qualified app/firmware/build/test source equivalence and original successful checks')
          print('PASS: recovered original native result and screenshots; only prior upload steps failed on quota')
          PY
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Prepare retained release signer
        env:
          KEYSTORE_BASE64: ${{ secrets.TELERC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telerc-release.jks"
          echo "TELERC_KEYSTORE_FILE=$RUNNER_TEMP/telerc-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK from qualified sources
        env:
          TELERC_KEYSTORE_PASSWORD: ${{ secrets.TELERC_KEYSTORE_PASSWORD }}
          TELERC_KEY_ALIAS: ${{ secrets.TELERC_KEY_ALIAS }}
          TELERC_KEY_PASSWORD: ${{ secrets.TELERC_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify retained identity and package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.75 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.75.apk --output "$RUNNER_TEMP/telerc-baseline.apk"
          cp app/build/outputs/apk/release/app-release.apk deliverables/TeleRC-v0.8.76.apk
          python scripts/verify-fpv-apk.py deliverables/TeleRC-v0.8.76.apk "$RUNNER_TEMP/telerc-baseline.apk" > deliverables/BUILD_INFO.txt
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('deliverables/BUILD_INFO.txt')
          s=p.read_text().replace('PASS (preceding required steps)','PASS (qualified source-identical run 39083855942)')
          s+='\nRelease packaging source: '+os.environ['GITHUB_SHA']+'\n'
          s+='Validation source: cfa044896a2f8ca40dffb78366d635a38b3722b5; run 39083855942; job 117546228725\n'
          s+='Runtime, firmware, build configuration, scripts and test sources: exact git diff match. Native frames included in evidence ZIP.\n'
          s+='This run rebuilt the signed APK and repeated signer/package/code94/CRC/permissions/USB registration/alignment checks.\n'
          s+='Prerelease distribution authorized by owner; physical phone/receiver/rover HIL remains BLOCKED. Firmware unchanged; no reflash.\n'
          p.write_text(s)
          print(s)
          PY
          git archive --format=zip -o deliverables/TeleRC-v0.8.76-source.zip HEAD
          cp docs/CONSOLE_076.md deliverables/START_HERE.md
          zip -qr deliverables/TeleRC-v0.8.76-check-evidence.zip validation-evidence app/build/photo-evidence
          cd deliverables
          sha256sum *.apk *.zip *.md BUILD_INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          python -c 'import glob,zipfile; assert all(zipfile.ZipFile(p).testzip() is None for p in glob.glob("*.zip"))'
      - name: Publish downloadable test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          cd deliverables
          gh release create v0.8.76 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "TeleRC v0.8.76 — expanded center panes" --notes-file START_HERE.md *.apk *.zip *.md BUILD_INFO.txt SHA256SUMS.txt
          gh release view v0.8.76 --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease
      - if: always()
        run: rm -f "$RUNNER_TEMP/telerc-release.jks"
