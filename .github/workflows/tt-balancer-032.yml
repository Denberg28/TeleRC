name: TT Balancer v0.3.2 verification
on:
  push:
    branches:
      - feature/tt-balancer-v0.3.2-direct-arm
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balancer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Host regression (direction gate on and off)
        run: bash bridge/TT_Balancer_ESP32S3/tests/run.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32-S3 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile ESP32-S3 sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --build-property compiler.cpp.extra_flags="-DBALANCER_REQUIRE_DIRECTION_CONFIRMATION=0" \
            bridge/TT_Balancer_ESP32S3
