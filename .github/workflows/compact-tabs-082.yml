name: Build and release compact Setup and mission actions 0.8.82
on:
  push:
    branches: ['release/compact-tabs-082-*']
  workflow_dispatch:
concurrency:
  group: compact-tabs-082-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - run: ./scripts/check-android-env.sh
      - name: Preserve existing safety engine, camera and firmware
        run: python scripts/check-fc-elrs-scope.py
      - name: Host regression and default sanitizers
        run: |
          python bridge/sync_motor_core.py --check
          python -m unittest discover -s scripts -p 'test_firmware_package.py'
          bridge/tests/run.sh
          SANITIZE=1 bridge/tests/run.sh
          bridge/mini_wifi_tests/run.sh
          SANITIZE=1 bridge/mini_wifi_tests/run.sh
          bridge/mini_wifi_tests/check_profiles.sh
      - name: Reuse qualified signed product after test-only dialog synchronization fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_PRODUCT=07bf25a3378cc2c18efb36212baebd8b2b746f8f
          git diff --exit-code "$BASE_PRODUCT" HEAD -- app/src/main app/src/test app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew bridge scripts/check-fc-elrs-scope.py
          gh api repos/$GITHUB_REPOSITORY/actions/runs/39153631308/jobs > /tmp/prior-jobs.json
          python - <<'CHECK'
          import json
          jobs=json.load(open('/tmp/prior-jobs.json'))['jobs']
          steps={s['name']:s['conclusion'] for s in jobs[0]['steps']}
          for name in ['Preserve existing safety engine, camera and firmware','Host regression and default sanitizers','JVM, debug and signed release builds, lint and native harness compile','Retain signed review APK before native qualification']:
              assert steps[name]=='success', (name,steps[name])
          CHECK
          mkdir -p deliverables
          gh release download "elrs-recovery-review-$BASE_PRODUCT" --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.82.apk --output deliverables/TeleRC-v0.8.82.apk
      - name: Build unchanged debug product and synchronized native harness
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Reclaim tools before native checks
        run: python scripts/reclaim-ui-runner.py
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native ELRS recovery states, Waypoint and existing UI regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/check-photo-ui.sh || { adb exec-out screencap -p > /tmp/native-failure.png; python -c 'import base64,pathlib; print("NATIVE_FAILURE_PNG="+base64.b64encode(pathlib.Path("/tmp/native-failure.png").read_bytes()).decode())'; adb shell uiautomator dump /sdcard/failure.xml; adb shell cat /sdcard/failure.xml; adb logcat -d -b crash; adb logcat -d -s AndroidRuntime ActivityManager ActivityTaskManager; exit 1; }
      - name: Verify signing continuity and package tested sources and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.81 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.81.apk --output "$RUNNER_TEMP/telerc-baseline.apk"
          python scripts/verify-compact-tabs-apk.py deliverables/TeleRC-v0.8.82.apk "$RUNNER_TEMP/telerc-baseline.apk" > deliverables/BUILD_INFO.txt
          cp docs/COMPACT_TABS_082.md deliverables/START_HERE.md
          git archive --format=zip -o deliverables/TeleRC-v0.8.82-source.zip HEAD
          printf '%s\n' 'Signed APK product commit: 07bf25a3378cc2c18efb36212baebd8b2b746f8f' 'Build/unit/lint/default sanitizer qualification: run 39153631308' 'Current product sources are byte-identical; test harness adds a wait for the dialog Close button.' >> deliverables/BUILD_INFO.txt
          zip -qr deliverables/TeleRC-v0.8.82-check-evidence.zip app/build/photo-evidence app/src/androidTest
          cd deliverables
          sha256sum *.apk *.zip *.md BUILD_INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          python -c 'import glob,zipfile; assert all(zipfile.ZipFile(p).testzip() is None for p in glob.glob("*.zip"))'
      - name: Publish software-qualified test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          gh release create v0.8.82 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'TeleRC v0.8.82 — compact Setup and mission actions' --notes-file deliverables/START_HERE.md deliverables/*
          gh release edit v0.8.82 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Retain published release bundle for download
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TeleRC-v0.8.82-release
          path: deliverables/
          retention-days: 1
      - if: always()
        run: rm -f "$RUNNER_TEMP/telerc-release.jks"

