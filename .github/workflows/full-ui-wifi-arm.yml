name: Restored TeleRC UI with Wi-Fi arm-disarm
on:
  push:
    branches: ['work/full-ui-wifi-arm-*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Full existing firmware host regression
        run: |
          python bridge/sync_motor_core.py --check
          bridge/tests/run.sh
          SANITIZE=1 bridge/tests/run.sh
      - name: Prepare retained release signer
        env:
          KEYSTORE_BASE64: ${{ secrets.TELERC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telerc-release.jks"
          echo "TELERC_KEYSTORE_FILE=$RUNNER_TEMP/telerc-release.jks" >> "$GITHUB_ENV"
      - name: Full Android unit tests, lint and signed APK
        env:
          TELERC_KEYSTORE_PASSWORD: ${{ secrets.TELERC_KEYSTORE_PASSWORD }}
          TELERC_KEY_ALIAS: ${{ secrets.TELERC_KEY_ALIAS }}
          TELERC_KEY_PASSWORD: ${{ secrets.TELERC_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Mini rover protocol integration
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/mini-rover/emit-heartbeat.cpp -o /tmp/emit-mini-heartbeat
          /tmp/emit-mini-heartbeat | xxd -p > /tmp/mini-heartbeat.hex
          cmp /tmp/mini-heartbeat.hex tests/mini-rover/heartbeat.hex
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/mini-rover/interop.cpp -o /tmp/mini-interop
          /tmp/mini-interop app/build/mini-rover-interop
      - name: Verify signer, upgrade identity and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir deliverables
          cp app/build/outputs/apk/release/app-release.apk deliverables/TeleRC-v0.8.56.apk
          gh release download v0.8.55 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.55-WiFi-only.apk --output "$RUNNER_TEMP/telerc-baseline.apk"
          python scripts/verify-mini-apk.py deliverables/TeleRC-v0.8.56.apk "$RUNNER_TEMP/telerc-baseline.apk" > deliverables/BUILD_INFO.txt
          git archive --format=zip --output=deliverables/TeleRC-v0.8.56-source.zip HEAD
          cp docs/MINI_ROVER_WIFI.md deliverables/START_HERE.md
          (cd app/build && zip -r "$RUNNER_TEMP/evidence.zip" reports test-results mini-rover-interop)
          cp "$RUNNER_TEMP/evidence.zip" deliverables/TeleRC-v0.8.56-build-evidence.zip
          cd deliverables
          sha256sum *.apk *.zip BUILD_INFO.txt START_HERE.md > SHA256SUMS.txt
      - name: Publish restored-interface test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd deliverables
          gh release create v0.8.56 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "TeleRC v0.8.56 — full interface restored, Wi-Fi arm/disarm" --notes-file START_HERE.md *.apk *.zip BUILD_INFO.txt SHA256SUMS.txt START_HERE.md
      - if: always()
        run: rm -f "$RUNNER_TEMP/telerc-release.jks"
