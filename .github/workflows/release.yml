name: Signed APK release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release-trigger'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - run: ./scripts/check-android-env.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: Validate dedicated controller and gateway safety
        run: |
          python bridge/sync_motor_core.py --check
          bridge/tests/run.sh
          SANITIZE=1 bridge/tests/run.sh
      - name: Compile matching dedicated ESP32-S3 sketches
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install RadioLib@7.2.1
          for sketch in TeleRCBridge TeleRCHybridController TeleRCMotorController TeleRCWiFiGateway TeleRCLoRaBase TeleRCLoRaRover; do
            arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --libraries bridge/libraries "bridge/$sketch"
          done
          for sketch in TeleRCLoRaBase TeleRCLoRaRover; do
            arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc --libraries bridge/libraries --build-property 'compiler.cpp.extra_flags=-DTELERC_RADIO_VARIANT=1276 -DTELERC_BASE_WIFI=0' "bridge/$sketch"
          done
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TELERC_KEYSTORE_BASE64 }}
          TELERC_KEYSTORE_PASSWORD: ${{ secrets.TELERC_KEYSTORE_PASSWORD }}
          TELERC_KEY_ALIAS: ${{ secrets.TELERC_KEY_ALIAS }}
          TELERC_KEY_PASSWORD: ${{ secrets.TELERC_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$TELERC_KEYSTORE_PASSWORD" && test -n "$TELERC_KEY_ALIAS" && test -n "$TELERC_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telerc-release.jks"
          echo "TELERC_KEYSTORE_FILE=$RUNNER_TEMP/telerc-release.jks" >> "$GITHUB_ENV"
      - name: Test and build release
        env:
          TELERC_KEYSTORE_PASSWORD: ${{ secrets.TELERC_KEYSTORE_PASSWORD }}
          TELERC_KEY_ALIAS: ${{ secrets.TELERC_KEY_ALIAS }}
          TELERC_KEY_PASSWORD: ${{ secrets.TELERC_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease --no-daemon
      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$version"
          awk -v release="## $version" '$0 == release {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cp app/build/outputs/apk/release/app-release.apk "TeleRC-v${version}.apk"
          git archive --format=zip --output="TeleRC-bridge-v${version}.zip" "$GITHUB_SHA" bridge
          curl --fail --location --retry 2 https://github.com/Denberg28/TeleRC/releases/download/v0.8.50/TeleRC-v0.8.50.apk --output "$RUNNER_TEMP/telerc-baseline.apk"
          python scripts/verify-release.py "TeleRC-v${version}.apk" "$RUNNER_TEMP/telerc-baseline.apk" > BUILD_INFO.txt
          sha256sum "TeleRC-v${version}.apk" "TeleRC-bridge-v${version}.zip" BUILD_INFO.txt > SHA256SUMS.txt
          gh release create "v${version}" "TeleRC-v${version}.apk" "TeleRC-bridge-v${version}.zip" SHA256SUMS.txt BUILD_INFO.txt --title "TeleRC v${version} test candidate" --notes-file release-notes.md --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        with:
          name: TeleRC-release
          path: |
            TeleRC-v*.apk
            TeleRC-bridge-v*.zip
            SHA256SUMS.txt
            BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeleRC-release-evidence
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.xml
      - if: always()
        run: rm -f "$RUNNER_TEMP/telerc-release.jks"
