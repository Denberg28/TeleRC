name: Skydroid USB FPV review build
on:
  push:
    branches: ['fix/skydroid-usb-fpv-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Existing control and firmware host regression
        run: |
          python bridge/sync_motor_core.py --check
          bridge/tests/run.sh
          SANITIZE=1 bridge/tests/run.sh
      - name: Prepare existing signer
        env:
          KEYSTORE_BASE64: ${{ secrets.TELERC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telerc-release.jks"
          echo "TELERC_KEYSTORE_FILE=$RUNNER_TEMP/telerc-release.jks" >> "$GITHUB_ENV"
      - name: JVM tests, debug and release lint/build
        env:
          TELERC_KEYSTORE_PASSWORD: ${{ secrets.TELERC_KEYSTORE_PASSWORD }}
          TELERC_KEY_ALIAS: ${{ secrets.TELERC_KEY_ALIAS }}
          TELERC_KEY_PASSWORD: ${{ secrets.TELERC_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:lintRelease :app:assembleRelease --no-daemon
      - name: Verify compiled USB registration and retained signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.64 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.64.apk --output "$RUNNER_TEMP/telerc-baseline.apk"
          mkdir -p deliverables
          cp app/build/outputs/apk/release/app-release.apk deliverables/TeleRC-v0.8.66-Skydroid-test.apk
          python scripts/verify-fpv-apk.py deliverables/TeleRC-v0.8.66-Skydroid-test.apk "$RUNNER_TEMP/telerc-baseline.apk" > deliverables/BUILD_INFO.txt
          cp docs/SKYDROID_FPV_066.md deliverables/START_HERE.md
          git archive --format=zip -o deliverables/TeleRC-v0.8.66-source.zip HEAD
          cd deliverables
          sha256sum *.apk *.zip *.md BUILD_INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeleRC-Skydroid-check-evidence
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*
      - uses: actions/upload-artifact@v4
        with:
          name: TeleRC-v0.8.66-Skydroid-test
          path: deliverables/
          retention-days: 30
