name: Persistent USB FPV qualification
on:
  push:
    branches: ['fix/fpv-persistent-077*']
concurrency:
  group: maze-dialogs-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Preflight retained signed baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.8.76 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.76.apk --output "$RUNNER_TEMP/telerc-baseline.apk"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Prove unchanged APK sources and recover the retained signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code 965a5782b5600df681c141cf7913b5fdefdbf852 HEAD -- app/src/main app/src/test app/build.gradle.kts bridge scripts tests build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat
          mkdir -p deliverables validation-evidence
          gh api repos/$GITHUB_REPOSITORY/actions/runs/39088962262 > validation-evidence/product-run.json
          gh api repos/$GITHUB_REPOSITORY/actions/runs/39088962262/jobs > validation-evidence/product-jobs.json
          gh api --allow-escape-sequences repos/$GITHUB_REPOSITORY/actions/jobs/117561384660/logs > validation-evidence/product-build.log
          gh release view v0.8.77 --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,tagName > validation-evidence/draft.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('validation-evidence')
          run=json.loads((p/'product-run.json').read_text())
          assert run['head_sha']=='965a5782b5600df681c141cf7913b5fdefdbf852' and run['status']=='completed'
          job=next(j for j in json.loads((p/'product-jobs.json').read_text())['jobs'] if j['id']==117561384660)
          for name in ['Existing control and firmware host regression','JVM tests, debug and release lint/build','Retain review APK in draft before native qualification']:
              assert next(s for s in job['steps'] if s['name']==name)['conclusion']=='success',name
          d=json.loads((p/'draft.json').read_text())
          assert d['isDraft'] and d['tagName']=='v0.8.77' and d['targetCommitish']=='965a5782b5600df681c141cf7913b5fdefdbf852'
          print('PASS: exact product/unit/firmware/build source match; original build/JVM/lint/sanitizers retained')
          print('Prior native tab-menu timeout is not reused as a passing UI result; fresh native qualification follows')
          PY
          gh release download v0.8.77 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.77.apk --output deliverables/TeleRC-v0.8.77.apk
      - name: Build current native test APK and debug app, lint changed test harness
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Reclaim completed tooling before emulator
        run: python scripts/reclaim-ui-runner.py
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native maze, photo background and FPV menu checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          cores: 4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/check-photo-ui.sh
      - name: Verify compiled USB registration and retained signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables
          GITHUB_SHA=965a5782b5600df681c141cf7913b5fdefdbf852 python scripts/verify-fpv-apk.py deliverables/TeleRC-v0.8.77.apk "$RUNNER_TEMP/telerc-baseline.apk" > deliverables/BUILD_INFO.txt
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('deliverables/BUILD_INFO.txt')
          s=p.read_text().replace('PASS (preceding required steps)','PASS (source-identical product run 39088962262)')
          s+='\nAPK build source: 965a5782b5600df681c141cf7913b5fdefdbf852; original run 39088962262\n'
          s+='Validation/source-archive commit: '+os.environ['GITHUB_SHA']+'\n'
          s+='Only native test synchronization/workflow changed. Runtime/unit/firmware/build/script sources match exactly. Fresh native UI checks passed in this run.\n'
          p.write_text(s)
          print(s)
          PY
          cp docs/FPV_PERSISTENT_077.md deliverables/START_HERE.md
          git archive --format=zip -o deliverables/TeleRC-v0.8.77-source.zip HEAD
          cd deliverables
          sha256sum *.apk *.zip *.md BUILD_INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Package check evidence
        run: |
          zip -qr deliverables/TeleRC-v0.8.77-check-evidence.zip app/build/reports/lint-results-* app/build/photo-evidence validation-evidence app/src/androidTest
          cd deliverables
          sha256sum *.apk *.zip *.md BUILD_INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish qualified test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          cd deliverables
          python -c 'import glob,zipfile; assert all(zipfile.ZipFile(p).testzip() is None for p in glob.glob("*.zip"))'
          gh release upload v0.8.77 --repo "$GITHUB_REPOSITORY" *.zip *.md BUILD_INFO.txt SHA256SUMS.txt
          gh release edit v0.8.77 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false --notes-file START_HERE.md
