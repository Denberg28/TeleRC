name: Waypoint tab qualification
on:
  push:
    branches: ['feature/waypoint-079*']
concurrency:
  group: waypoint-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Preserve existing tabs, firmware and manual protocol
        run: python scripts/check-waypoint-scope.py
      - name: Existing control and firmware host regression
        run: |
          python bridge/sync_motor_core.py --check
          bridge/tests/run.sh
          SANITIZE=1 bridge/tests/run.sh
      - name: Prepare retained release signer
        env:
          KEYSTORE_BASE64: ${{ secrets.TELERC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telerc-release.jks"
          echo "TELERC_KEYSTORE_FILE=$RUNNER_TEMP/telerc-release.jks" >> "$GITHUB_ENV"
      - name: JVM tests, debug and release lint/build
        env:
          TELERC_KEYSTORE_PASSWORD: ${{ secrets.TELERC_KEYSTORE_PASSWORD }}
          TELERC_KEY_ALIAS: ${{ secrets.TELERC_KEY_ALIAS }}
          TELERC_KEY_PASSWORD: ${{ secrets.TELERC_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon
      - name: Retain review APK in draft before native qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/release/app-release.apk deliverables/TeleRC-v0.8.79.apk
          gh release create "waypoint-review-$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "TeleRC Waypoint review $GITHUB_SHA" deliverables/TeleRC-v0.8.79.apk
      - name: Reclaim completed tooling before emulator
        run: python scripts/reclaim-ui-runner.py
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Waypoint planning and existing tab regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/check-photo-ui.sh || { adb logcat -d -b crash; adb logcat -d -s AndroidRuntime ActivityManager ActivityTaskManager; exit 1; }
      - name: Verify signing, version, USB registration and archive evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.78 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.78.apk --output "$RUNNER_TEMP/telerc-baseline.apk"
          python scripts/verify-fpv-apk.py deliverables/TeleRC-v0.8.79.apk "$RUNNER_TEMP/telerc-baseline.apk" > deliverables/BUILD_INFO.txt
          cp docs/WAYPOINT_079.md deliverables/START_HERE.md
          git archive --format=zip -o deliverables/TeleRC-v0.8.79-source.zip HEAD
          zip -qr deliverables/TeleRC-v0.8.79-check-evidence.zip app/build/reports/tests app/build/test-results app/build/reports/lint-results-* app/build/photo-evidence
          cd deliverables
          sha256sum *.apk *.zip *.md BUILD_INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          python -c 'import glob,zipfile; assert all(zipfile.ZipFile(p).testzip() is None for p in glob.glob("*.zip"))'
      - name: Publish software-qualified test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          gh release create v0.8.79 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'TeleRC v0.8.79 — Waypoint planning and guarded navigation' --notes-file deliverables/START_HERE.md deliverables/*
          gh release edit v0.8.79 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - if: always()
        run: rm -f "$RUNNER_TEMP/telerc-release.jks"
