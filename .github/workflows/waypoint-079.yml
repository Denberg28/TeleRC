name: Waypoint tab qualification
on:
  push:
    branches: ['feature/waypoint-079*']
concurrency:
  group: waypoint-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Preserve existing tabs, firmware and manual protocol
        run: python scripts/check-waypoint-scope.py
      - name: Prove qualified product sources and recover signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code c40ade17cabaff4e5980191c4afa90a1ab906a66 HEAD -- app/src/main app/src/test app/build.gradle.kts bridge scripts tests build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat
          mkdir -p deliverables validation-evidence
          gh api repos/$GITHUB_REPOSITORY/actions/runs/39108538493 > validation-evidence/product-run.json
          gh api repos/$GITHUB_REPOSITORY/actions/runs/39108538493/jobs > validation-evidence/product-jobs.json
          gh api --allow-escape-sequences repos/$GITHUB_REPOSITORY/actions/jobs/117619567802/logs > validation-evidence/product-build.log
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('validation-evidence')
          run=json.loads((p/'product-run.json').read_text())
          assert run['head_sha']=='c40ade17cabaff4e5980191c4afa90a1ab906a66' and run['status']=='completed'
          job=next(j for j in json.loads((p/'product-jobs.json').read_text())['jobs'] if j['id']==117619567802)
          for name in ['Preserve existing tabs, firmware and manual protocol','Existing control and firmware host regression','JVM tests, debug and release lint/build','Retain review APK in draft before native qualification']:
              assert next(s for s in job['steps'] if s['name']==name)['conclusion']=='success',name
          assert [s['name'] for s in job['steps'] if s['conclusion']=='failure']==['Native Waypoint planning and existing tab regression']
          assert "Quickstep isn't responding" in (p/'product-build.log').read_text()
          print('PASS: exact runtime/unit/firmware/build/script match and qualified signed product; original native failure not counted as PASS')
          PY
          gh release download waypoint-review-c40ade17cabaff4e5980191c4afa90a1ab906a66 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.79.apk --output deliverables/TeleRC-v0.8.79.apk
      - name: Build current native harness and debug APK; lint changed harness
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Reclaim completed tooling before emulator
        run: python scripts/reclaim-ui-runner.py
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Waypoint planning and existing tab regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/check-photo-ui.sh || { adb logcat -d -b crash; adb logcat -d -s AndroidRuntime ActivityManager ActivityTaskManager; exit 1; }
      - name: Verify signing, version, USB registration and archive evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.78 --repo "$GITHUB_REPOSITORY" --pattern TeleRC-v0.8.78.apk --output "$RUNNER_TEMP/telerc-baseline.apk"
          python scripts/verify-fpv-apk.py deliverables/TeleRC-v0.8.79.apk "$RUNNER_TEMP/telerc-baseline.apk" > deliverables/BUILD_INFO.txt
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('deliverables/BUILD_INFO.txt')
          s=p.read_text().replace('PASS (preceding required steps)','PASS (source-identical product run39108538493)')
          s+='\nSigned APK product source: c40ade17cabaff4e5980191c4afa90a1ab906a66; run39108538493/job117619567802\n'
          s+='Validation/source archive: '+os.environ['GITHUB_SHA']+'\n'
          s+='Only instrumentation launcher-dialog recovery, workflow and docs differ. Original product logs/results are retained; unavailable original runner XML/lint files are not reconstructed. Fresh full native suite passed in this run.\n'
          p.write_text(s)
          print(s)
          PY
          cp docs/WAYPOINT_079.md deliverables/START_HERE.md
          git archive --format=zip -o deliverables/TeleRC-v0.8.79-source.zip HEAD
          zip -qr deliverables/TeleRC-v0.8.79-check-evidence.zip app/build/reports/lint-results-* app/build/photo-evidence validation-evidence app/src/androidTest
          cd deliverables
          sha256sum *.apk *.zip *.md BUILD_INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          python -c 'import glob,zipfile; assert all(zipfile.ZipFile(p).testzip() is None for p in glob.glob("*.zip"))'
      - name: Publish software-qualified test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          gh release create v0.8.79 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title 'TeleRC v0.8.79 — Waypoint planning and guarded navigation' --notes-file deliverables/START_HERE.md deliverables/*
          gh release edit v0.8.79 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - if: always()
        run: rm -f "$RUNNER_TEMP/telerc-release.jks"
